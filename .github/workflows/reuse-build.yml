name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (default the ref that triggered the workflow)
        type: string
        default: ''
      tag:
        description: Single image tag replacing the tags derived from the ref (e.g. staging)
        type: string
        default: ''
      pull-requests:
        description: JSON object merged into BUILD.json (baseCommit, pullRequests, excludedPullRequests of a staging build)
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Prepare docker image tags
      id: docker_meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        # the workflow context, not git: the git context fails on a commit checked out detached (a staging
        # build). The image's revision label names the triggering commit there; BUILD.json has the built one
        tags: |
          type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          type=ref,event=branch,enable=${{ inputs.tag == '' }}
          type=ref,event=pr,enable=${{ inputs.tag == '' }}
          type=semver,pattern={{version}},enable=${{ inputs.tag == '' }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.tag == '' }}
          type=semver,pattern={{major}},enable=${{ inputs.tag == '' }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Github container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # BUILD.json is added in the last layer of the Dockerfile: a build whose code is unchanged
    # (a staging branch with no pull request) only rebuilds that layer
    - name: Prepare BUILD.json
      env:
        VERSION: ${{ inputs.tag || github.ref_name }}
        REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        EXTRA: ${{ inputs.pull-requests || '{}' }}
      run: |
        jq -n --arg version "$VERSION" --arg repository "$REPOSITORY" --arg commit "$(git rev-parse HEAD)" --arg date "$(date -Is)" --argjson extra "$EXTRA" \
          '{version: $version, repository: $repository, commit: $commit, date: $date} + $extra' > BUILD.json
        cat BUILD.json

    - name: Build and push docker images
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        platforms: linux/amd64
        labels: ${{ steps.docker_meta.outputs.labels }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache,mode=max
    
    - name: Stop test dependencies
      run: docker compose stop

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}