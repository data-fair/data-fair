name: Quality checks

# The full gate: static checks in one job, and the whole test suite (unit, api, e2e)
# split over parallel shards. Each shard is a fresh runner with its own services, so the
# suite's single-worker constraint (tests share one dev env state) holds inside each one.
# Used by pull requests, releases and the nightly check of master; the pre-push hook only
# runs a light subset (see docs/architecture/testing.md).

on:
  workflow_call:
    inputs:
      retries:
        description: playwright retries per failed test (the nightly run uses 0 to expose flaky tests)
        type: number
        default: 1
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check ratchet
      run: npm run check-types-ratchet

    - name: Build types
      run: npm run build-types

    - name: Build UI
      run: npm -w ui run build

    - name: Type check UI
      run: npm -w ui run check-types

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      OGR2OGR_SKIP: 'true'
      # empty on workflow_dispatch, where playwright.config.ts falls back to 1
      TEST_RETRIES: ${{ inputs.retries }}
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # a cold release build of the rust module is the most expensive setup step (~1.5 min),
    # paid again in every shard; the cache only rebuilds it when the rust sources change
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: parquet-writer

    - name: Build parquet-writer
      run: npm -w parquet-writer run build

    - name: Install playwright browser
      run: npx playwright install --with-deps chromium

    - name: Init .env
      run: ./dev/init-env.sh

    - name: Use localhost as DEV_HOST in CI
      run: sed -i 's/^DEV_HOST=.*/DEV_HOST=localhost/' .env

    # the dev profile, not test: e2e pages need events, registry, agents and capture,
    # and it keeps CI on the exact set of services the tests run against locally.
    # s3-init is a one-shot container: --wait counts it as up while it is still running,
    # but reports an error if it exits before the last service turns healthy, which is a race
    # it loses often. Keeping it out of the wait and running it to completion afterwards also
    # closes the other half of the problem: --wait used to return while the buckets were still
    # being created, so the tests could start without them.
    - name: Start services
      run: docker compose --profile dev up -d --wait --scale s3-init=0

    - name: Create S3 buckets
      run: docker compose --profile dev run --rm s3-init

    - name: Start mock server
      run: npx dotenv -- npm run dev-mock &

    - name: Start dev API
      run: npx dotenv -- npm run dev-api &

    - name: Start dev UI
      run: npx dotenv -- npm run dev-ui &

    # vite compiles on first request: without a warm-up the first e2e page load of the
    # shard spends its navigation timeout on dependency optimization
    - name: Wait for API and UI
      run: |
        set -a; . ./.env; set +a
        for url in "http://localhost:$NGINX_PORT1/data-fair/api/v1/ping" "http://localhost:$NGINX_PORT1/data-fair/"; do
          for _ in $(seq 120); do curl -sf -o /dev/null "$url" && break; sleep 1; done
          curl -sf -o /dev/null "$url" || { echo "not ready: $url"; exit 1; }
        done

    - name: Run tests
      run: npx playwright test --shard=${{ matrix.shard }}/3

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.shard }}
        path: |
          test-results/
          dev/logs/
        retention-days: 7

    - name: Stop services
      if: always()
      run: docker compose --profile dev down
