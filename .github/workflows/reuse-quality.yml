name: Quality checks

# The full gate. One build job (types, UI, parquet-writer) shared as an artifact; static checks
# and unit tests in one job; api tests and two e2e shards in three parallel jobs. Each test job is
# a fresh runner with its own services, so the suite's single-worker constraint (tests share one
# dev env state) holds inside each one. Split by project first: --shard over the whole suite
# follows the file order and came out unbalanced (16 s / 2.6 min / 23.9 min).
# Used by pull requests, releases and the nightly check of master; the pre-push hook only
# runs a light subset (see docs/architecture/testing.md).

on:
  workflow_call:
    inputs:
      retries:
        description: playwright retries per failed test (the nightly run uses 0 to expose flaky tests)
        type: number
        default: 1
      browser:
        description: browser engine of the e2e tests (chromium, firefox or webkit; the nightly run rotates them)
        type: string
        default: chromium
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # a cold release build of the rust module is the most expensive build step (~1.5 min);
    # the cache only rebuilds it when the rust sources change
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: parquet-writer

    - name: Build parquet-writer
      run: npm -w parquet-writer run build

    # the generated .type modules are imported by the API, the tests and the UI build
    - name: Build types
      run: npm run build-types

    # the API reads ui/dist/index.html at startup (lib-express createSpaMiddleware) and dies
    # without it, even though the pages themselves come from the dev UI; ui/dts feeds the UI type check
    - name: Build UI
      run: npm -w ui run build

    - name: Upload build outputs
      uses: actions/upload-artifact@v4
      with:
        name: build
        include-hidden-files: true # the .type directories
        retention-days: 1
        path: |
          **/.type/
          !**/node_modules/**
          ui/dist/
          ui/dts/
          parquet-writer/*.node

  static:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download build outputs
      uses: actions/download-artifact@v4
      with:
        name: build

    - name: Lint
      run: npm run lint

    # the ratchet counts errors against the generated .type modules
    - name: Type check ratchet
      run: npm run check-types-ratchet

    - name: Type check UI
      run: npm -w ui run check-types

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical

    # no server needed, but some units import #config, whose development config reads .env
    - name: Init .env
      run: ./node_modules/.bin/df-dev init-env # local bin only: a bare npx would fetch an unrelated "df-dev" from the registry if the dependency were missing

    - name: Unit tests
      run: npx playwright test --project=unit

  tests:
    name: tests (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # e2e runs ~15-20 min against ~12 for api: two e2e shards keep the jobs close
      matrix:
        include:
          - { name: api, project: api, args: '' }
          - { name: e2e 1/2, project: e2e, args: '--shard=1/2' }
          - { name: e2e 2/2, project: e2e, args: '--shard=2/2' }
    env:
      OGR2OGR_SKIP: 'true'
      # empty on workflow_dispatch, where playwright.config.ts falls back to 1
      TEST_RETRIES: ${{ inputs.retries }}
      # empty on workflow_dispatch, where playwright.config.ts falls back to chromium
      TEST_BROWSER: ${{ inputs.browser }}
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download build outputs
      uses: actions/download-artifact@v4
      with:
        name: build

    # only the browser binaries are cached, keyed on the installed playwright version and engine;
    # the system packages they need are installed on every run
    - name: Read the playwright version
      if: matrix.project == 'e2e'
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache playwright browsers
      if: matrix.project == 'e2e'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser || 'chromium' }}

    - name: Install playwright browser
      if: matrix.project == 'e2e' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}

    - name: Install playwright system dependencies
      if: matrix.project == 'e2e' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ inputs.browser || 'chromium' }}

    - name: Init .env
      run: ./node_modules/.bin/df-dev init-env # local bin only: a bare npx would fetch an unrelated "df-dev" from the registry if the dependency were missing

    - name: Use localhost as DEV_HOST in CI
      run: sed -i 's/^DEV_HOST=.*/DEV_HOST=localhost/' .env

    # the zellij panes get .env from df-dev; here every later step does
    - name: Export .env to the next steps
      run: cat .env >> "$GITHUB_ENV"

    # every profile, not only the core services: e2e pages need events, registry, agents and
    # capture (each optional service has its own profile, see dev/dev.json "optional").
    # s3-init is a one-shot container: --wait counts it as up while it is still running,
    # but reports an error if it exits before the last service turns healthy, which is a race
    # it loses often. Keeping it out of the wait and running it to completion afterwards also
    # closes the other half of the problem: --wait used to return while the buckets were still
    # being created, so the tests could start without them.
    - name: Start services
      run: docker compose --profile '*' up -d --wait --scale s3-init=0

    - name: Create S3 buckets
      run: docker compose --profile '*' run --rm s3-init

    - name: Start mock server
      run: mkdir -p dev/logs && node --experimental-strip-types --disable-warning=ExperimentalWarning dev/mock-server.ts > dev/logs/mock.log 2>&1 &

    # same commands as the api and ui panes of .zellij.kdl, logs in dev/logs for the upload below
    - name: Start dev API
      run: |
        export NODE_CONFIG=$(./node_modules/.bin/df-dev absent-config)
        cd api && MODE=server_worker NODE_ENV=development EVENTS_LOG_LEVEL=error sh ../dev/run-api.sh > ../dev/logs/api.log 2>&1 &

    # vite hashes the API's ui-config to link it: same absent-config as the API
    - name: Start dev UI
      run: |
        export NODE_CONFIG=$(./node_modules/.bin/df-dev absent-config)
        cd ui && NODE_CONFIG_DIR=../api/config/ ../node_modules/.bin/vite --port $DEV_UI_PORT > ../dev/logs/ui.log 2>&1 &

    # the e2e-warmup project then pays vite's first-request transforms
    - name: Wait for API and UI
      run: |
        for url in "http://localhost:$NGINX_PORT/data-fair/api/v1/ping" "http://localhost:$NGINX_PORT/data-fair/"; do
          for _ in $(seq 120); do curl -sf -o /dev/null "$url" && break; sleep 1; done
          curl -sf -o /dev/null "$url" || { echo "not ready: $url"; tail -n 50 dev/logs/*.log; exit 1; }
        done

    - name: Run tests
      run: npx playwright test --project=${{ matrix.project }} ${{ matrix.args }}

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ strategy.job-index }}-${{ matrix.project }}
        path: |
          test-results/
          dev/logs/
        retention-days: 7

    - name: Docker compose logs on failure
      if: failure()
      run: docker compose --profile '*' logs

    - name: Stop services
      if: always()
      run: docker compose --profile '*' down
