# full quality checks on master, once a night, only when master moved since the last
# green nightly run. It catches what reached master without a pull request (direct pushes
# only pass the light pre-push hook), and runs without retries so flaky tests show up
# instead of being absorbed.

name: Nightly quality checks

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        last=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
        echo "master: ${{ github.sha }}, last green nightly: ${last:-none}"
        if [ "$last" = "${{ github.sha }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi

  quality:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/reuse-quality.yml
    with:
      retries: 0
