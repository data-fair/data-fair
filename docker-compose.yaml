services:

  nginx:
    image: nginx:1.29.4-alpine
    network_mode: host
    environment:
      - DEV_HOST=${DEV_HOST}
      - NGINX_PORT=${NGINX_PORT}
      - NGINX_PORT2=${NGINX_PORT2}
      - DEV_API_PORT=${DEV_API_PORT}
      - DEV_UI_PORT=${DEV_UI_PORT}
      - SD_PORT=${SD_PORT}
      - CAPTURE_PORT=${CAPTURE_PORT}
      - OAV_PORT=${OAV_PORT}
      - EVENTS_PORT=${EVENTS_PORT}
      - AGENTS_PORT=${AGENTS_PORT}
      - REGISTRY_PORT=${REGISTRY_PORT}
    volumes:
      - ./dev/resources/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  simple-directory:
    image: ghcr.io/data-fair/simple-directory:master
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=${SD_PORT}
      - PUBLIC_URL=http://${DEV_HOST}:${NGINX_PORT}/simple-directory
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/simple-directory
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev-cipher-password-0123456789abcdef
      - STORAGE_TYPE=file
      - ADMINS=["test_superadmin@test.com","superadmin@test.com","alban.mouton@koumoul.com"]
      - CONTACT=contact@test.com
      # in dev simple-directory only notifies this service, directly (the shared identities router refuses calls through the proxy)
      - IDENTITIES_WEBHOOKS=[{"base":"http://localhost:${DEV_API_PORT}/api/v1/identities","key":"secret-identities"}]
      # tests log in through the API many times per minute
      - AUTHRATELIMIT_ATTEMPTS=200
      - AUTHRATELIMIT_DURATION=1
      - MANAGE_DEPARTMENTS=true
      - MANAGE_PARTNERS=true
      - MANAGE_SITES=true
      - SECRET_SITES=secret-sites
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails
      - PRIVATE_EVENTS_URL=http://localhost:${EVENTS_PORT}
      # data-fair's tests: publication sites on unknown hosts, listing and roles of members, org creation
      - ACCEPT_UNKNOWN_SITE=true
      - LIST_USERS_MODE=admin
      - LIST_ORGANIZATIONS_MODE=authenticated
      - ROLES_DEFAULTS=["admin","contrib","user"]
      - DEFAULT_MAX_CREATED_ORGS=10
      - ANONYMOUS_ACTION_NOT_BEFORE=1s
      # API key expiration mails (data-fair → sd /api/mails), delivered to maildev
      - MAILDEV_ACTIVE=true
      - MAILDEV_URL=http://localhost:${MAILDEV_UI_PORT}
      - MAILS_TRANSPORT={"host":"localhost","port":${MAILDEV_SMTP_PORT},"ignoreTLS":true}
      # per recipient, stored in mongo: repeated test runs would stop the mails silently
      - MAILSRATELIMIT_POINTS=100000
    volumes:
      - ./dev/resources/users.json:/app/data/users.json
      - ./dev/resources/organizations.json:/app/data/organizations.json
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${SD_PORT}"]
      interval: 2s
      timeout: 2s
      retries: 60

  events:
    profiles:
      - events
    image: ghcr.io/data-fair/events:main
    network_mode: host
    depends_on:
      - mongo
    environment:
      - PORT=${EVENTS_PORT}
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair-events
      - OBSERVER_ACTIVE=false
      - SECRET_IDENTITIES=secret-identities
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails

  agents:
    profiles:
      - agents
    image: ${AGENTS_IMAGE:-ghcr.io/data-fair/agents:main}
    network_mode: host
    depends_on:
      - mongo
    environment:
      - PORT=${AGENTS_PORT}
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - PRIVATE_EVENTS_URL=http://localhost:${EVENTS_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair-agents
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev-cipher-password-0123456789abcdef
      - SECRET_EVENTS=secret-events
      # the image has no model by default: the mock provider of agents' development config
      - PROVIDERS=[{"type":"mock","id":"global-mock","name":"Global Mock","enabled":true}]
      - MODELS=[{"id":"mock-model","name":"Global Mock Model","provider":"global-mock","usage":["assistant","tools","summarizer","evaluator","moderator"],"inputPricePerMillion":0,"outputPricePerMillion":0}]
      - DEFAULT_MODELS={"assistant":{"provider":"global-mock","id":"mock-model"}}
      - DEFAULT_CREDITS=-1

  # registry-side dev container — same domain as data-fair under /registry
  registry:
    profiles:
      - registry
    image: ghcr.io/data-fair/registry:main
    network_mode: host
    depends_on:
      - mongo
      - simple-directory
    environment:
      - PORT=${REGISTRY_PORT}
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair-registry
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev-cipher-password-0123456789abcdef
      - API_KEYS_SALT=dev-api-keys-salt-0123456789abcdef01
      - SECRET_INTERNAL_SERVICES=secret-registry-internal
      - FILES_STORAGE=fs
      # /tmp is world-writable in the registry image; the container runs as
      # uid 1000 ("node") and can't write to a docker-managed volume without an
      # init step. Tarballs are throwaway in dev so keep them in the container.
      - DATA_DIR=/tmp/registry-data

  # catalogs:
  #   profiles:
  #     - catalogs
  #   image: ghcr.io/data-fair/catalogs:master
  #   network_mode: host
  #   depends_on:
  #     - mongo
  #   environment:
  #     - PORT=${CATALOGS_PORT}
  #     - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
  #     - PRIVATE_EVENTS_URL=http://localhost:${EVENTS_PORT}
  #     - MONGO_URL=mongodb://localhost:${MONGO_PORT}/catalogs
  #     - OBSERVER_ACTIVE=false
  #     - CIPHER_PASSWORD=dev-cipher-password-0123456789abcdef
  #     - SECRET_EVENTS=secret-events
  #     - SECRET_CATALOGS=secret-catalogs
  #     - SECRET_IDENTITIES=secret-identities
  #     - IGNORE_ASSERT_REQ_INTERNAL=true
  #     - DATA_DIR=/data
  #   volumes:
  #     - ./data/catalogs:/data

  openapi-viewer:
    profiles:
      - openapi-viewer
    image: ghcr.io/data-fair/openapi-viewer:feat-implement-serialize-query-params
    network_mode: host
    environment:
      - PORT=${OAV_PORT}
      - USE_SIMPLE_DIRECTORY=true
      - PRIVATE_DIRECTORY_URL=http://${DEV_HOST}:${NGINX_PORT}/simple-directory
      - ALLOWED_URLS={"general":"http://${DEV_HOST}:${NGINX_PORT}/data-fair/api/v1/api-docs.json","dataset":"http://${DEV_HOST}:${NGINX_PORT}/data-fair/api/v1/datasets/{id}/api-docs.json","privateDataset":"http://${DEV_HOST}:${NGINX_PORT}/data-fair/api/v1/datasets/{id}/private-api-docs.json","application":"http://${DEV_HOST}:${NGINX_PORT}/data-fair/api/v1/applications/{id}/api-docs.json","remoteService":"http://${DEV_HOST}:${NGINX_PORT}/data-fair/api/v1/remote-services/{id}/api-docs.json"}

  capture:
    profiles:
      - capture
    image: ghcr.io/data-fair/capture:master
    network_mode: host
    shm_size: '1gb'
    environment:
      - PORT=${CAPTURE_PORT}
      - PUBLIC_URL=http://${DEV_HOST}:${NGINX_PORT}/capture
      - ONLY_SAME_HOST=false
      - OBSERVER_ACTIVE=false
      - PUPPETEER_ARGS=["--no-sandbox"]

  maildev:
    profiles:
      - maildev
    image: maildev/maildev:2.1.0
    ports:
      - ${MAILDEV_UI_PORT}:1080
      - ${MAILDEV_SMTP_PORT}:1025
    # https://github.com/maildev/maildev/issues/484
    healthcheck:
      test: 'wget -O - http://127.0.0.1:$${MAILDEV_WEB_PORT}$${MAILDEV_BASE_PATHNAME}/healthz || exit 1'

  clamav:
    image: clamav/clamav:1.5.1
    ports:
      - ${CLAMAV_PORT}:3310
    environment:
      - CLAMAV_NO_FRESHCLAMD=true
      - CLAMAV_NO_MILTERD=true
      - CLAMD_CONF_DatabaseDirectory=/var/lib/clamav-dev
    # the official signature database costs ~1g resident per stack; dev and
    # tests only ever scan the EICAR test file, so clamd loads a single
    # signature instead (~30m). Real-world detection is not exercised here.
    volumes:
      - ./dev/resources/clamav-db:/var/lib/clamav-dev:ro
      - clamav-tmp:/tmp
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "3310"]

  elasticsearch:
    image: ghcr.io/data-fair/elasticsearch:8.19.9
    ports:
      - ${ES_PORT}:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ingest.geoip.downloader.enabled=false
      # features the services never use, skipped to lighten the boot
      - xpack.ml.enabled=false
      - xpack.watcher.enabled=false
      - stack.templates.enabled=false
      - cluster.deprecation_indexing.enabled=false
      # heap starts at 64m and grows up to 512m (pre-touching a fixed 512m cost ~360m per idle stack);
      # an agent that needs more sets ES_HEAP=1g in .env (df-dev never overwrites it)
      - ES_JAVA_OPTS=-Xms64m -Xmx${ES_HEAP:-512m}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      # 2 s probes while starting (df-dev wait-deps gives up after 3 min), then one per minute
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 2s
    # several dev environments run side by side on one laptop, and ES pre-touches its whole heap at
    # boot. mem_limit bounds the off-heap side too, and memswap_limit equal to it forbids swap, so a
    # runaway ES is killed inside its container instead of pushing the host into a global OOM (which
    # takes the desktop session down with it, see docs/architecture/dev-resources.md).
    mem_limit: 2g
    memswap_limit: 2g
    # halves the boot CPU burst (ES sizes its thread pools, GC and JIT threads to the quota)
    cpus: ${ES_CPUS:-2}

  mongo:
    image: mongo:8
    ports:
      - ${MONGO_PORT}:27017
    # wiredTiger takes half the machine's RAM by default
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      # 2 s probes while starting, then one per minute: a mongosh probe costs ~1.3 s of CPU
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 2s
    ulimits:
      nofile:
        soft: 64000
        hard: 64000

  # single S3 backend for dev/test: serves both the files storage (bucketdev)
  # and the object-lock-capable data-integrity revision store (compliance WORM).
  # RustFS replaced MinIO when its community images left Docker Hub (2026-09).
  s3:
    image: rustfs/rustfs:1.0.0-rc.6
    ports:
      - ${S3_PORT}:9000
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    volumes:
      - s3-data:/data

  # RustFS does not auto-create buckets: this one-shot init creates them.
  # Only the integrity bucket gets object lock; the files bucket must stay mutable.
  s3-init:
    image: amazon/aws-cli:2.32.0
    depends_on:
      - s3
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://s3:9000
    entrypoint: >
      /bin/sh -c "
      until aws s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws s3api head-bucket --bucket bucketdev 2>/dev/null || aws s3api create-bucket --bucket bucketdev;
      aws s3api head-bucket --bucket data-fair-integrity 2>/dev/null || aws s3api create-bucket --bucket data-fair-integrity --object-lock-enabled-for-bucket;
      "

volumes:
  elasticsearch-data:
  mongo-data:
  s3-data:
  clamav-tmp:
